services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cijene
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cijene}
      POSTGRES_DB: cijene
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cijene"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: &env
      DATABASE_URL: postgresql+psycopg://cijene:${POSTGRES_PASSWORD:-cijene}@db:5432/cijene
      TEST_DATABASE_URL: postgresql+psycopg://cijene:${POSTGRES_PASSWORD:-cijene}@db:5432/cijene_test
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PUBLIC_MODE: ${PUBLIC_MODE:-true}
      TZ: Europe/Zagreb
    ports: ["${API_PORT:-8000}:8000"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "app.worker", "schedule"]
    environment:
      <<: *env
      INGEST_AT: ${INGEST_AT:-08:30}
      RETRY_UNTIL_HOUR: ${RETRY_UNTIL_HOUR:-14}
      INGEST_CHAINS: ${INGEST_CHAINS:-cijenedev,plodine}
      CIJENEDEV_CHAINS: ${CIJENEDEV_CHAINS:-konzum,lidl,kaufland,spar}
      INGEST_ON_START: ${INGEST_ON_START:-false}
      RAW_ARCHIVE_DIR: /data/raw
    volumes:
      - rawdata:/data/raw
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  pgdata:
  rawdata:
