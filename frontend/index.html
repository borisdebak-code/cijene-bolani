<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cijene BoLaNI</title>
  <meta name="description" content="Usporedba cijena proizvoda u trgovinama u Hrvatskoj">
  <meta name="theme-color" content="#0b6e4f">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BoLaNI">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/chart.umd.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <!--APP-->
  <header class="top">
    <div class="wrap top-inner">
      <a href="#" data-go="home" class="logo" aria-label="Cijene BoLaNI – početna">Cijene <span class="lb">Bo</span><span class="lr">La</span><span class="lb">N</span><span class="lr">I</span></a>
      <form id="search-form" class="search" role="search" autocomplete="off">
        <svg class="s-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="Traži proizvod ili barkod" aria-label="Pretraga proizvoda"
               role="combobox" aria-autocomplete="list" aria-controls="sug-list" aria-expanded="false" enterkeyhint="search">
        <div id="sug" class="sug" hidden>
          <div class="sug-scroll">
            <ul id="sug-list" class="sug-list" role="listbox" aria-label="Rezultati pretrage"></ul>
            <div class="sbar" aria-hidden="true"><div class="sthumb"></div></div>
          </div>
          <div id="sug-refine" class="refine"></div>
        </div>
      </form>
    </div>
  </header>

  <main class="wrap">
    <a href="#" data-go="back" id="back" class="small back" hidden>← natrag</a>
    <div id="view" aria-live="polite"></div>
  </main>

  <footer class="wrap foot">
    Cijene iz službenih cjenika trgovaca (Odluka NN 75/2025). <span id="updated"></span>
  </footer>

  <button id="fab" class="fab" aria-expanded="false" aria-controls="panel" aria-label="Popis za kupnju">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
    <span>Popis</span><span id="fab-count" class="fab-count" hidden>0</span>
  </button>

  <aside id="panel" class="panel" hidden aria-label="Popis za kupnju">
    <header class="panel-head">
      <h2>Popis za kupnju</h2>
      <button id="panel-close" class="icon" aria-label="Zatvori">×</button>
    </header>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="shops">Po trgovinama</button>
      <button role="tab" data-tab="items">Proizvodi</button>
      <button role="tab" data-tab="one">Sve u jednoj</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
    <footer id="panel-foot" class="panel-foot"></footer>
  </aside>

  <div id="pick" class="pick" hidden>
    <div class="pick-box" role="dialog" aria-modal="true" aria-labelledby="pick-title">
      <h2 id="pick-title">U koju trgovinu?</h2>
      <p id="pick-sub" class="muted small"></p>
      <div id="pick-opts" class="pick-opts"></div>
      <button id="pick-later" class="link">Svejedno, odluči kasnije</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
